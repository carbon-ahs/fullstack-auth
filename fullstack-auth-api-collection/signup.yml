info:
  name: signup
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8000/auth/signup
  body:
    type: json
    data: |-
      {
        "name":"name",
        "email":"email",
        "password": "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
